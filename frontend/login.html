<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - DAYFLOW HRMS</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/forms.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-left">
            <div class="auth-brand">
                <img src="assets/logos/dayflow-logo.svg" alt="DAYFLOW Logo" class="auth-logo">
                <h1>DAYFLOW HRMS</h1>
                <p>Every workday, perfectly aligned.</p>
            </div>
        </div>
        <div class="auth-right">
            <div class="auth-card">
                <h2>Sign In</h2>
                <p class="auth-subtitle">Access your dashboard</p>
                <form id="loginForm" class="auth-form">
                    <div class="form-group">
                        <label for="identifier">Login ID / Email</label>
                        <input type="text" id="identifier" required placeholder="e.g., OIJODO20260001 or john@company.com">
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <div class="password-field">
                            <input type="password" id="password" required placeholder="Enter your password">
                            <button type="button" class="toggle-password" aria-label="Show password">👁</button>
                        </div>
                    </div>
                    <div class="form-checkbox">
                        <input type="checkbox" id="rememberMe">
                        <label for="rememberMe">Remember me</label>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block" id="loginBtn">Sign In</button>
                    <div class="auth-links">
                        <a href="register.html">Create company account</a>
                        <span>•</span>
                        <a href="#" id="forgotLink">Forgot password?</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div id="toast-container"></div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/session.js"></script>
    <script src="js/notifications.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
