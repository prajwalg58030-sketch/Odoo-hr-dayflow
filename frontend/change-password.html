<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password - DAYFLOW HRMS</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/forms.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-left">
            <div class="auth-brand">
                <img src="assets/logos/dayflow-logo.svg" alt="DAYFLOW Logo" class="auth-logo">
                <h1>DAYFLOW HRMS</h1>
                <p>Every workday, perfectly aligned.</p>
            </div>
        </div>
        <div class="auth-right">
            <div class="auth-card">
                <h2>Change your password</h2>
                <p class="auth-subtitle">Set a secure password before continuing.</p>
                <form id="changePasswordForm" class="auth-form">
                    <div class="form-group">
                        <label for="currentPassword">Current password</label>
                        <input type="password" id="currentPassword" required autocomplete="current-password">
                    </div>
                    <div class="form-group">
                        <label for="newPassword">New password</label>
                        <input type="password" id="newPassword" required minlength="8" autocomplete="new-password">
                    </div>
                    <div class="form-group">
                        <label for="confirmPassword">Confirm new password</label>
                        <input type="password" id="confirmPassword" required minlength="8" autocomplete="new-password">
                    </div>
                    <button type="submit" class="btn btn-primary btn-block" id="changePasswordBtn">Update Password</button>
                </form>
            </div>
        </div>
    </div>

    <div id="toast-container"></div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/session.js"></script>
    <script src="js/notifications.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
