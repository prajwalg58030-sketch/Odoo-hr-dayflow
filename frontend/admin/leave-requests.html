<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leave Requests - DAYFLOW HRMS</title>
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/sidebar.css">
    <link rel="stylesheet" href="../css/tables.css">
    <link rel="stylesheet" href="../css/modals.css">
    <link rel="stylesheet" href="../css/leave.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar" id="sidebar"></aside>
        <div class="main-wrapper">
            <nav class="navbar" id="navbar"></nav>
            <main class="main-content">
                <div class="page-header">
                    <h1 class="page-title">Time Off Requests</h1>
                </div>
                <div class="filter-bar">
                    <select id="statusFilter">
                        <option value="">All Statuses</option>
                        <option value="PENDING">Pending</option>
                        <option value="APPROVED">Approved</option>
                        <option value="REJECTED">Rejected</option>
                    </select>
                    <select id="leaveTypeFilter"><option value="">All Types</option></select>
                </div>
                <div class="card">
                    <div class="card-body" id="leaveRequestsTable">
                        <!-- Table rendered by leave-requests.js -->
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Reject Modal -->
    <div class="modal" id="rejectModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Reject Leave Request</h3>
                <button class="modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <form id="rejectForm">
                    <div class="form-group">
                        <label>Comment</label>
                        <textarea id="adminComment" required></textarea>
                    </div>
                    <input type="hidden" id="rejectLeaveId">
                    <button type="submit" class="btn btn-danger">Reject</button>
                </form>
            </div>
        </div>
    </div>

    <div id="toast-container"></div>
    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/session.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/notifications.js"></script>
    <script src="../js/navigation.js"></script>
    <script src="../js/admin/leave-requests.js"></script>
</body>
</html>
