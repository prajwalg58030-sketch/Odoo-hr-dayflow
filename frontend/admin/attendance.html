<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Management - DAYFLOW HRMS</title>
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/sidebar.css">
    <link rel="stylesheet" href="../css/tables.css">
    <link rel="stylesheet" href="../css/attendance.css">
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar" id="sidebar"></aside>
        <div class="main-wrapper">
            <nav class="navbar" id="navbar"></nav>
            <main class="main-content">
                <div class="page-header">
                    <h1 class="page-title">Attendance</h1>
                </div>
                <div class="filter-bar">
                    <input type="text" id="searchInput" placeholder="Search employee...">
                    <input type="date" id="fromDate">
                    <input type="date" id="toDate">
                    <select id="departmentFilter"><option value="">All Departments</option></select>
                    <button class="btn btn-outline" id="clearFilters">Clear</button>
                </div>
                <div class="card">
                    <div class="card-body">
                        <div id="attendanceTableContainer">
                            <!-- Table rendered by attendance.js -->
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <div id="toast-container"></div>
    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/session.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/notifications.js"></script>
    <script src="../js/navigation.js"></script>
    <script src="../js/admin/attendance.js"></script>
</body>
</html>
