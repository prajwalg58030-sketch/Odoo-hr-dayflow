<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Details - DAYFLOW HRMS</title>
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/sidebar.css">
    <link rel="stylesheet" href="../css/tables.css">
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar" id="sidebar"></aside>
        <div class="main-wrapper">
            <nav class="navbar" id="navbar"></nav>
            <main class="main-content">
                <div class="page-header">
                    <h1 class="page-title" id="employeeName">Employee Details</h1>
                </div>
                <div class="profile-container">
                    <div class="card">
                        <div class="card-header"><h3>Profile</h3></div>
                        <div class="card-body" id="profileSection"></div>
                    </div>
                    <div class="card">
                        <div class="card-header"><h3>Work Information</h3></div>
                        <div class="card-body" id="workInfoSection"></div>
                    </div>
                </div>
                <div class="card">
                    <div class="card-header"><h3>Attendance</h3></div>
                    <div class="card-body" id="attendanceSection">Loading...</div>
                </div>
                <div class="card">
                    <div class="card-header"><h3>Leave Requests</h3></div>
                    <div class="card-body" id="leaveSection">Loading...</div>
                </div>
                <div class="card">
                    <div class="card-header"><h3>Documents</h3></div>
                    <div class="card-body" id="documentsSection">Loading...</div>
                </div>
            </main>
        </div>
    </div>

    <div id="toast-container"></div>
    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/session.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/notifications.js"></script>
    <script src="../js/navigation.js"></script>
    <script src="../js/admin/employee-details.js"></script>
</body>
</html>
