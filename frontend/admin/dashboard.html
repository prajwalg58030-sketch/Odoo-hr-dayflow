<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HR Dashboard - DAYFLOW HRMS</title>
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/sidebar.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar" id="sidebar"></aside>
        <div class="main-wrapper">
            <nav class="navbar" id="navbar"></nav>
            <main class="main-content">
                <div class="page-header">
                    <h1 class="page-title">Dashboard</h1>
                </div>
                <div class="metric-grid" id="metricGrid">
                    <!-- Populated by dashboard.js -->
                </div>
                <div class="dashboard-grid">
                    <div class="card">
                        <div class="card-header"><h3>Attendance Trend</h3></div>
                        <div class="card-body"><canvas id="attendanceChart"></canvas></div>
                    </div>
                    <div class="card">
                        <div class="card-header"><h3>Department Distribution</h3></div>
                        <div class="card-body"><canvas id="departmentChart"></canvas></div>
                    </div>
                </div>
                <div class="card">
                    <div class="card-header"><h3>Pending Leave Requests</h3></div>
                    <div class="card-body" id="pendingLeavesTable">Loading...</div>
                </div>
            </main>
        </div>
    </div>

    <div id="toast-container"></div>
    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/session.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/notifications.js"></script>
    <script src="../js/navigation.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="../js/admin/dashboard.js"></script>
</body>
</html>
