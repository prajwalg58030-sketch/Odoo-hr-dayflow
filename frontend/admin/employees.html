<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management - DAYFLOW HRMS</title>
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/sidebar.css">
    <link rel="stylesheet" href="../css/forms.css">
    <link rel="stylesheet" href="../css/tables.css">
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar" id="sidebar"></aside>
        <div class="main-wrapper">
            <nav class="navbar" id="navbar"></nav>
            <main class="main-content">
                <div class="page-header">
                    <h1 class="page-title">Employees</h1>
                    <button class="btn btn-primary" id="addEmployeeBtn">Add Employee</button>
                </div>
                <div class="filter-bar">
                    <input type="text" id="searchInput" placeholder="Search by name, ID, department...">
                    <select id="departmentFilter">
                        <option value="">All Departments</option>
                    </select>
                    <button class="btn btn-outline" id="clearFilters">Clear Filters</button>
                </div>
                <div class="employee-grid" id="employeeGrid">
                    <!-- Employee cards will be rendered here -->
                </div>
            </main>
        </div>
    </div>

    <!-- Add Employee Modal -->
    <div class="modal" id="addEmployeeModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Create Employee</h3>
                <button class="modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <form id="createEmployeeForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label>First Name</label>
                            <input type="text" name="first_name" required>
                        </div>
                        <div class="form-group">
                            <label>Last Name</label>
                            <input type="text" name="last_name" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label>Phone</label>
                        <input type="tel" name="phone" required>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Department</label>
                            <input type="text" name="department">
                        </div>
                        <div class="form-group">
                            <label>Designation</label>
                            <input type="text" name="designation">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Joining Date</label>
                        <input type="date" name="joining_date" required>
                    </div>
                    <div class="form-group">
                        <label>Address</label>
                        <textarea name="address" rows="2"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Create Employee</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Credentials Modal -->
    <div class="modal" id="credentialsModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Employee Created</h3>
                <button class="modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <p>Login ID: <strong id="credLoginId"></strong></p>
                <p>Temporary Password: <strong id="credPassword"></strong></p>
                <button class="btn btn-outline" id="copyLoginId">Copy Login ID</button>
                <button class="btn btn-outline" id="copyPassword">Copy Password</button>
            </div>
        </div>
    </div>

    <div id="toast-container"></div>
    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/session.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/notifications.js"></script>
    <script src="../js/navigation.js"></script>
    <script src="../js/admin/employees.js"></script>
</body>
</html>
