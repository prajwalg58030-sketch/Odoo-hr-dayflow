<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Attendance - DAYFLOW HRMS</title>
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/sidebar.css">
    <link rel="stylesheet" href="../css/tables.css">
    <link rel="stylesheet" href="../css/attendance.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar" id="sidebar"></aside>
        <div class="main-wrapper">
            <nav class="navbar" id="navbar"></nav>
            <main class="main-content">
                <div class="page-header">
                    <h1 class="page-title">Attendance</h1>
                </div>
                <div class="attendance-actions">
                    <button id="checkInBtn" class="btn btn-success">Check In</button>
                    <button id="checkOutBtn" class="btn btn-danger" style="display:none;">Check Out</button>
                </div>
                <div class="attendance-summary" id="attendanceSummary">
                    <!-- Summary cards populated by attendance.js -->
                </div>
                <div class="card">
                    <div class="card-header">
                        <h3>Attendance History</h3>
                    </div>
                    <div class="card-body">
                        <div class="month-navigation">
                            <button id="prevMonth" class="btn btn-outline btn-sm">Previous</button>
                            <span id="currentMonthLabel">Month</span>
                            <button id="nextMonth" class="btn btn-outline btn-sm">Next</button>
                        </div>
                        <div id="attendanceTableContainer">
                            <!-- Table loaded by attendance.js -->
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <div id="toast-container"></div>
    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/session.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/notifications.js"></script>
    <script src="../js/navigation.js"></script>
    <script src="../js/employee/attendance.js"></script>
</body>
</html>
